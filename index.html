<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <header>
        <nav>
            <h1 style = "color: #006D77;font-size: 80px;">Daily Planner</h1>
            <br>
            <ul>
                <li><a href="#habit-table">Habits</a></li>
                <li><a href="#reminders">Reminders</a></li>
                <li><a href="#daily-tasks">Tasks</a></li>
            </ul>
        </nav>
    </header>

    <section id="quote-section" style = "background-color: #FFDDD2;">
        <p style = "font-size: 30px; text-align: center;">"Time is the most valuable thing a man can spend." - Theophrastus</p>
    </section>

    <section id="daily-tasks">
        <h2>Daily Tasks</h2>
        <input type="text" id="taskInput" placeholder="Add a task...">
        <button onclick="addTask()">Add Task</button>
        <ul id="taskList"></ul>
    </section>

    <section id="reminders">
        <h2>Reminders</h2>
        <input type="text" id="reminderInput" placeholder="Add a reminder...">
        <button onclick="addReminder()">Add Reminder</button>
        <ul id="reminderList"></ul>
    </section>

    <section id="habit-table">
        <h2>Habit Tracker</h2>
        <div class="habit-controls">
            <input type="text" id="habitInput" placeholder="Enter a new habit">
            <button onclick="addHabit()">Add Habit</button>
        </div>
        <div class = "table-responsive">

        <table id="habitTable">
            <thead>
                <tr>
                    <th style = "text-align:center;">Habit</th>
                    <th>Sunday</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                    <th>Saturday</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="habitBody">
                
            </tbody>
        </table>
        </div>

    </section>

    <footer>
        <p>&copy; 2025 Daily Planner.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
